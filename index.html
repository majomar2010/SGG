<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Inicio de Sesión Pastel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <button id="theme-toggle" aria-label="Cambiar modo de color" type="button">
            🌙 Modo Oscuro
        </button>
    </header>

    <main class="login-container">
        <section class="login-card">
            <h2>Sistema de Gestión de Gastos (SGG)</h2>
            <p>Ingrese sus credenciales de acceso</p>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label id="username-label" for="username">Usuario:</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        aria-labelledby="username-label"
                        aria-required="true"
                        placeholder="Ej: admin@sgg.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label id="password-label" for="password">Contraseña:</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        aria-labelledby="password-label"
                        aria-required="true"
                        placeholder="••••••••"
                        required
                    >
                </div>

                <div id="message-container" role="alert" aria-live="assertive"></div>

                <button type="submit" class="btn-submit">Ingresar al Sistema</button>
            </form>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
