<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Iniciar Sesión</title>
    <meta name="description" content="Pantalla de inicio de sesión para el Sistema de Gestión de Gastos.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <button id="theme-toggle" class="theme-btn" aria-label="Cambiar a modo oscuro" aria-pressed="false">
            🌙 Modo Oscuro
        </button>
    </header>

    <main class="login-container">
        <div class="card">
            <h1>Sistema de Gestión de Gastos</h1>
            <h2>¡Hola! Te damos la bienvenida</h2>
            
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Ej: analistaQA">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                </div>
                
                <div id="form-message" class="message-box" aria-live="polite"></div>
                
                <button type="submit" class="submit-btn">Iniciar Sesión</button>
            </form>

            <div class="login-links">
                <a href="#" id="link-forgot">¿Te olvidaste la contraseña?</a>
                <a href="registro.html" id="link-register">¿No tenés cuenta? <span>Registrate</span></a>
            </div>
        </div>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
