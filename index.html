<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Portal de Acceso</title>
    <meta name="description" content="Acceso moderno al Sistema de Gestión de Gastos.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <button id="theme-toggle" class="theme-btn" aria-label="Cambiar a modo oscuro" aria-pressed="false">
            <span class="icon" aria-hidden="true">🌙</span> MODO OSCURO
        </button>
    </header>

    <main class="login-container">
        <div class="card">
            <h1>Sistema de Gestión de Gastos</h1>
            
            <div class="tab-container">
                <button id="tab-login" class="tab-btn active">Iniciar Sesión</button>
                <button id="tab-register" class="tab-btn">Registrarse</button>
            </div>
            
            <div class="form-wrapper">
                <form id="login-form" novalidate>
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" required autocomplete="username" placeholder="Tu usuario de prueba">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                    </div>
                    <button type="submit" class="submit-btn">Ingresar →</button>
                </form>

                <form id="register-form" class="hidden" novalidate>
                    <div class="form-group">
                        <label for="reg-name">Nombre Completo</label>
                        <input type="text" id="reg-name" name="reg-name" required placeholder="Ej: Juan Pérez">
                    </div>
                    <div class="form-group">
                        <label for="reg-username">Elegir Usuario</label>
                        <input type="text" id="reg-username" name="reg-username" required autocomplete="username" placeholder="Ej: juan123">
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Contraseña</label>
                        <input type="password" id="reg-password" name="reg-password" required autocomplete="new-password" placeholder="Mínimo 6 caracteres">
                    </div>
                    <button type="submit" class="submit-btn">Crear Cuenta →</button>
                </form>
            </div>
            
            <div id="form-message" class="message-box" aria-live="polite"></div>
        </div>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
