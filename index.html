<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <button id="theme-toggle" class="theme-btn">🌙 Modo Oscuro</button>
    </header>
    <main class="card">
        <h1>Sistema de Gestión de Gastos</h1>
        <h2>¡Hola! Te damos la bienvenida</h2>
        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="username">Email Registrado</label>
                <input type="email" id="username" required placeholder="Ej: user@corporativo.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" required placeholder="••••••••">
                    <button type="button" class="toggle-password" aria-label="Mostrar contraseña">🙈</button>
                </div>
            </div>
            <div id="form-message" class="message-box" aria-live="polite"></div>
            <button type="submit" id="submit-btn" class="submit-btn">Iniciar Sesión</button>
        </form>
        <div class="login-links">
            <a href="recuperar.html" id="link-forgot">¿Te olvidaste la contraseña?</a>
            <a href="registro.html" id="link-register">¿No tenés cuenta? <span>Registrate</span></a>
        </div>
    </main>
    <script src="js/theme.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
