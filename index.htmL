<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Inicio de Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema visual" title="Alternar modo claro/oscuro">
        🌙
    </button>

    <main class="login-container">
        <section class="login-card">
            <h2>Sistema de Gestión de Gastos (SGG)</h2>
            <p>Por favor, ingrese sus credenciales para continuar.</p>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Usuario u Email</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Ej: jose.astesana" 
                        required 
                        aria-required="true"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required 
                        aria-required="true"
                    >
                </div>

                <div id="message-box" class="message-box hidden" role="alert" aria-live="assertive"></div>

                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </form>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
